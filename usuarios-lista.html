<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>USUARIOS — REPARATEC</title>
    <link rel="stylesheet" href="/src/css/home.css" />
    <link rel="stylesheet" href="/src/css/usuarios.css" />
  </head>
  <body>
    <div id="header-container"></div>

    <main class="container">
      <div class="page-header">
        <div>
          <h2>GESTIÓN DE USUARIOS</h2>
          <p style="color: var(--color-texto-suave); font-size: 0.9rem;">Cuentas registradas y roles asignados en el sistema.</p>
        </div>
        <a href="/usuario-form.html" class="btn btn-primary">+ Nuevo Usuario</a>
      </div>

      <div class="table-responsive" style="margin-bottom: 2.5rem;">
        <table class="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre Completo</th>
              <th>Correo</th>
              <th>Teléfono</th>
              <th>Rol</th>
              <th>Fecha Registro</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-usuarios-body"></tbody>
        </table>
        <p id="mensaje-vacio" class="empty-message" style="display: none;">
          No hay usuarios registrados en el sistema.
        </p>
      </div>

      <div class="page-header">
        <h2>CATALOGO DE ROLES</h2>
      </div>
      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre del Rol</th>
              <th>Descripción</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="tabla-roles-body"></tbody>
        </table>
      </div>
    </main>

    <div id="footer-container"></div>

    <script type="module" src="/src/js/proteccion.js"></script>
    <script type="module" src="/src/js/usuarios.js"></script>
  </body>
</html>
