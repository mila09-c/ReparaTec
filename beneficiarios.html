<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beneficiarios — ReparaTec</title>
  <link rel="stylesheet" href="/src/css/home.css" />
</head>
<body>
  <div id="header-container"></div>

  <main>
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem;">
      <div>
        <h1 class="section-title" style="margin-bottom: 0.25rem;">BENEFICIARIOS</h1>
        <p style="margin: 0; opacity: 0.8;">Registro y consulta de beneficiarios</p>
      </div>
      <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
        <a href="/solicitudes.html" class="module-link">Solicitudes &rarr;</a>
        <a href="/asignaciones.html" class="module-link">Asignaciones &rarr;</a>
        <a href="/evaluaciones.html" class="module-link">Evaluaciones &rarr;</a>
      </div>
    </div>

    <div id="mensaje-estado" style="margin-bottom: 1rem;"></div>

    <section style="background: var(--color-blanco); border: 1px solid var(--color-borde); border-top: 5px solid var(--color-acento-oscuro); border-radius: 0.75rem; padding: 1.5rem; margin-bottom: 2rem; box-shadow: 0 6px 16px rgba(30, 27, 75, 0.08);">
      <h2 style="margin-top: 0; margin-bottom: 1rem; font-size: 1.15rem;">Registrar Beneficiario</h2>
      <form id="form-beneficiario" novalidate style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem;">
        <div class="form-group">
          <label for="Tipo_beneficiario">Tipo de Beneficiario *</label>
          <select id="Tipo_beneficiario" required>
            <option value="">Seleccione un tipo...</option>
            <option value="Institucion Educativa">Institución Educativa</option>
            <option value="Asociacion Civil">Asociación Civil</option>
            <option value="Estudiante">Estudiante</option>
            <option value="Comunidad">Comunidad</option>
          </select>
          <span class="error-msg" id="error-Tipo_beneficiario"></span>
        </div>

        <div class="form-group">
          <label for="Institucion">Institución / Nombre *</label>
          <input type="text" id="Institucion" placeholder="Ej. Primaria Benito Juárez o Nombre" required />
          <span class="error-msg" id="error-Institucion"></span>
        </div>

        <div class="form-group" style="grid-column: 1 / -1;">
          <label for="Necesidad_tecnologica">Necesidad Tecnológica *</label>
          <input type="text" id="Necesidad_tecnologica" placeholder="Ej. Equipos para aula de cómputo o apoyo escolar" required />
          <span class="error-msg" id="error-Necesidad_tecnologica"></span>
        </div>

        <div style="grid-column: 1 / -1; display: flex; justify-content: flex-end;">
          <button type="submit" class="btn-positivo">Guardar</button>
        </div>
      </form>
    </section>

    <section>
      <h2 class="section-title">LISTADO DE BENEFICIARIOS</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Tipo</th>
              <th>Institución / Beneficiario</th>
              <th>Necesidad Tecnológica</th>
            </tr>
          </thead>
          <tbody id="tabla-beneficiarios-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script type="module" src="/src/js/beneficiarios.js"></script>
  <script type="module" src="/src/js/proteccion.js"></script>
</body>
</html>
