<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario de Usuarios — REPARATEC</title>
    <link rel="stylesheet" href="/src/css/usuarios.css" />
  </head>
  <body>
    <div id="header-container"></div>

    <main class="container">
      <form id="form-usuario" class="card" novalidate>
        <h2 id="form-titulo" class="card-title">Usuarios</h2>

        <div class="form-group">
          <label for="Nombre_Usuario">Nombre(s) *</label>
          <input
            type="text"
            id="Nombre_Usuario"
            name="Nombre_Usuario"
            placeholder="Ej. Carlos"
            required
          />
        </div>

        <div class="form-group">
          <label for="Apellido">Apellidos *</label>
          <input
            type="text"
            id="Apellido"
            name="Apellido"
            placeholder="Ej. Mendoza Ruiz"
            required
          />
        </div>

        <div class="form-group">
          <label for="Correo">Correo Electrónico *</label>
          <input
            type="email"
            id="Correo"
            name="Correo"
            placeholder="usuario@reparatec.org"
            required
          />
        </div>

        <div class="form-group">
          <label for="Contrasena_hash">Contraseña *</label>
          <input
            type="password"
            id="Contrasena_hash"
            name="Contrasena_hash"
            placeholder="••••••••"
            required
          />
        </div>

        <div class="form-group">
          <label for="Telefono">Teléfono *</label>
          <input
            type="tel"
            id="Telefono"
            name="Telefono"
            placeholder="2221001001"
            required
          />
        </div>

        <div class="form-group">
          <label for="ID_Rol">Rol *</label>
          <select id="ID_Rol" name="ID_Rol" required>
            <option value="">Selecciona un rol...</option>
            <option value="1">Administrador</option>
            <option value="2">Técnico</option>
            <option value="3">Donador</option>
            <option value="4">Beneficiario</option>
          </select>
        </div>

        <div class="form-group">
          <label for="Estado">Estado *</label>
          <select id="Estado" name="Estado" required>
            <option value="Activo">Activo</option>
            <option value="Inactivo">Inactivo</option>
          </select>
        </div>

        <div class="form-actions">
          <a href="usuarios-lista.html" class="btn btn-secondary">Cancelar</a>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </main>

    <div id="footer-container"></div>

    <script type="module" src="/src/js/proteccion.js"></script>
    <script type="module" src="/src/js/usuarios.js"></script>
  </body>
</html>
