<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FORMULARIO DE USUARIOS — REPARATEC</title>
    <link rel="stylesheet" href="/src/css/home.css" />
    <link rel="stylesheet" href="/src/css/usuarios.css" />
  </head>
  <body>
    <div id="header-container"></div>

    <main class="container">
      <form id="form-usuario" class="card" novalidate>
        <h2 id="form-titulo" style="margin-bottom: 1.25rem; color: var(--color-acento-oscuro);">Agregar Usuario</h2>

        <div class="form-group">
          <label for="Nombre_Usuario">Nombre(s) *</label>
          <input type="text" id="Nombre_Usuario" placeholder="Ej. Carlos" required />
        </div>

        <div class="form-group">
          <label for="Apellido">Apellidos *</label>
          <input type="text" id="Apellido" placeholder="Ej. Mendoza Ruiz" required />
        </div>

        <div class="form-group">
          <label for="Correo">Correo Electrónico *</label>
          <input type="email" id="Correo" placeholder="usuario@reparatec.org" required />
        </div>

        <div class="form-group">
          <label for="Telefono">Teléfono *</label>
          <input type="tel" id="Telefono" placeholder="2221001001" required />
        </div>

        <div class="form-group">
          <label for="ID_Rol">Rol *</label>
          <select id="ID_Rol" required></select>
          <option value="Activo">BENEFICIARIO</option>
          <option value="Inactivo">DONADOR</option>
          <option value="Inactivo">TECNICO</option>
        </div>

        <div class="form-group">
          <label for="Estado">Estado *</label>
          <select id="Estado" required>
            <option value="Activo">Activo</option>
            <option value="Inactivo">Inactivo</option>
          </select>
        </div>

        <div class="form-actions">
          <a href="usuarios-lista.html" class="btn btn-secondary">Cancelar</a>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </main>

    <div id="footer-container"></div>

    <script type="module" src="/src/js/proteccion.js"></script>
    <script type="module" src="/src/js/usuarios.js"></script>
  </body>
</html>
