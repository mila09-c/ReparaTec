<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulario de Módulo - REPARATEC</title>
  <link rel="stylesheet" href="/src/css/modulos.css" />
</head>
<body>
  <div id ="header-container"></div>

  <main class="modulos-container">
    <div class="form-card">
      <h1 id="titulo-form-modulo">Registrar Módulo</h1>
      <form id="form-modulo">
        <div class="form-group">
          <label for="nombre">Nombre del Módulo *</label>
          <input type="text" id="nombre" required />
        </div>

        <div class="form-group">
          <label for="descripcion">Descripción *</label>
          <textarea id="descripcion" rows="3" required></textarea>
        </div>

        <div class="form-group">
          <label for="ruta">Ruta / URL *</label>
          <input type="text" id="ruta" placeholder="/ejemplo-lista.html" required />
        </div>

        <div class="form-group">
          <label for="estado">Estado *</label>
          <select id="estado" required>
            <option value="Activo">Activo</option>
            <option value="Inactivo">Inactivo</option>
          </select>
        </div>

        <div class="form-actions">
          <a href="/modulos-lista.html" class="btn-secundario">Cancelar</a>
          <button type="submit" class="btn-primario">Guardar</button>
        </div>
      </form>
    </div>
  </main>

   <div id="footer-container"></div>

  <script type="module" src="/src/js/modulos.js"></script>
</body>
</html>
