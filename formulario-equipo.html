<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulario de Equipo — ReparaTec</title>
  <link rel="stylesheet" href="/src/css/login.css" />
</head>
<body>
  <div id="header-container"></div>

  <main class="login-wrapper">
    <section class="login-card" style="max-width: 600px;">
      <div class="login-header">
        <h1>Registrar / Editar Equipo</h1>
        <p>Complete los datos correspondientes a la tabla EQUIPOS</p>
      </div>

      <form id="form-equipo" novalidate>
        <div class="form-group">
          <label for="Codigo_inventario">Código de Inventario *</label>
          <input type="text" id="Codigo_inventario" placeholder="Ej. RT-LAP-004" required />
          <span class="error-msg" id="error-Codigo_inventario"></span>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label for="Marca">Marca *</label>
            <input type="text" id="Marca" placeholder="Ej. Dell, HP, Lenovo" required />
            <span class="error-msg" id="error-Marca"></span>
          </div>
          <div class="form-group">
            <label for="Modelo">Modelo *</label>
            <input type="text" id="Modelo" placeholder="Ej. Latitude 5420" required />
            <span class="error-msg" id="error-Modelo"></span>
          </div>
        </div>

        <div class="form-group">
          <label for="Numero_de_serie">Número de Serie *</label>
          <input type="text" id="Numero_de_serie" placeholder="Ej. SN123456X" required />
          <span class="error-msg" id="error-Numero_de_serie"></span>
        </div>

        <div class="form-group">
          <label for="Estado_equipo">Estado del Equipo *</label>
          <select id="Estado_equipo" required>
            <option value="">Seleccione un estado...</option>
            <option value="Operativo">Operativo</option>
            <option value="En reparación">En reparación</option>
            <option value="Asignado">Asignado</option>
            <option value="Baja">Baja</option>
          </select>
          <span class="error-msg" id="error-Estado_equipo"></span>
        </div>

        <button type="submit" class="btn-positivo" style="width: 100%;">Guardar Equipo</button>
      </form>
    </section>
  </main>

  <div id="footer-container"></div>

  <script type="module" src="/src/js/equipos-form.js"></script>
</body>
</html>
