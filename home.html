<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INICIO — ReparaTec</title>
  <link rel="stylesheet" href="/src/css/home.css" />
</head>
<body>
  <div id="header-container"></div>

  <main>
    <section class="welcome-banner">
      <div>
        <h1 id="mensaje-bienvenida">PANEL PRINCIPAL — ReparaTec</h1>
      </div>
      <a href="/equipos.html" class="btn-positivo">Ver Inventario</a>
    </section>

    <section aria-labelledby="titulo-modulos">
      <h2 class="section-title" id="titulo-modulos">Módulos del Sistema</h2>
      <div class="modules-grid" id="modulos-grid"></div>
    </section>

    <section id="equipos" aria-labelledby="titulo-equipos">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2 class="section-title" id="titulo-equipos" style="margin-bottom: 0;">EQUIPOS</h2>
        <a href="/equipos.html" class="module-link">Ver todos &rarr;</a>
      </div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Marca / Modelo</th>
              <th>Hardware (CPU / RAM / Alm.)</th>
              <th>Sistema Operativo</th>
              <th>Perfil</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="tabla-equipos-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script type="module" src="/src/js/home.js"></script>
  <script type="module" src="/src/js/proteccion.js"></script>
  
</body>
</html>
