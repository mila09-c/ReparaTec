<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventario de Equipos — ReparaTec</title>
  <link rel="stylesheet" href="/src/css/home.css" />
</head>
<body>
  <div id="header-container"></div>

  <main class="home-main">
    <section class="welcome-banner" aria-labelledby="titulo-equipos">
      <div class="welcome-content">
        <span class="welcome-badge">INVENTARIO</span>
        <h1 id="titulo-equipos">INVENTARIO DE EQUIPOS</h1>
        <p>Hardware registrado, categoría, especificaciones, perfil y estado.</p>
      </div>
      <div class="welcome-actions">
        <a href="/formulario-equipo.html" class="btn-positivo">+ Registrar Equipo</a>
      </div>
    </section>

    <section aria-labelledby="subtitulo-tabla-equipos">
      <div class="section-header-row">
        <div>
          <span class="section-tag">EQUIPOS</span>
          <h2 class="section-title" id="subtitulo-tabla-equipos">Listado General de Equipos</h2>
        </div>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Código / Serie</th>
              <th>Categoría</th>
              <th>Marca y Modelo</th>
              <th>Especificaciones</th>
              <th>Sistema Operativo</th>
              <th>Perfil</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-equipos-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script type="module" src="/src/js/proteccion.js"></script>
  <script type="module" src="/src/js/equipos-lista.js"></script>
</body>
</html>
