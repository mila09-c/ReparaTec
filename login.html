<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión — ReparaTec</title>
  <link rel="stylesheet" href="/src/css/login.css" />
</head>
<body>
  <div id="header-container"></div>

  <main class="login-wrapper">
    <div class="login-bg-grid" aria-hidden="true"></div>

    <section class="login-card" aria-labelledby="login-title">
      <div class="login-header">
        <span class="login-badge">ACCESO</span>
        <div class="login-logo-wrap">
          <img src="/image/logo.jpg" alt="Logo ReparaTec" />
        </div>
        <h1 id="login-title">Acceso a ReparaTec</h1>
        <p>Ingresa tus datos para continuar</p>
      </div>

      <form id="form-login" novalidate>
        <div class="form-group">
          <label for="Correo">Correo electrónico *</label>
          <input
            type="email"
            id="Correo"
            name="email"
            placeholder="usuario@reparatec.org"
            autocomplete="email"
            required
          />
          <span class="error-msg" id="error-Correo"></span>
        </div>

        <div class="form-group">
          <label for="Contrasena_hash">Contraseña *</label>
          <input
            type="password"
            id="Contrasena_hash"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
          <span class="error-msg" id="error-Contrasena"></span>
        </div>

        <p class="error-banner" id="error-login" role="alert" hidden></p>

        <button type="submit" class="btn-positivo">Iniciar sesión</button>
      </form>

      <div class="login-footer-note">
        ¿Aún no tienes cuenta? <a href="registro.html">Solicitar acceso</a>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script type="module" src="/src/js/login.js"></script>
</body>
</html>
